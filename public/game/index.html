<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Nexus" />
  <meta name="description" content="Nexus — a cyberpunk reflex game. Tap nodes before time runs out." />
  <meta name="theme-color" content="#06070a" />
  <title>Nexus — Cyber Reflex Game | Ciru</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #06070a;
      --panel: #0a0c12;
      --panel-2: #0f1219;
      --line: rgba(255,255,255,0.10);
      --line-strong: rgba(255,255,255,0.22);
      --text: #f0f0ed;
      --muted: #9aa0ae;
      --cyan: #39d0ff;
      --magenta: #ff2e9a;
      --amber: #ffd369;
      --green: #20d1a2;
      --red: #ff4e5f;
      --shadow: 0 30px 70px rgba(0,0,0,0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      color: var(--text);
      font-family: "Space Grotesk", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at 20% 30%, rgba(57,208,255,0.07), transparent 34%),
        radial-gradient(circle at 80% 70%, rgba(255,46,154,0.07), transparent 34%),
        linear-gradient(180deg, #06070a 0%, #0a0c12 100%);
      overflow: hidden;
      touch-action: none;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      padding-top: max(14px, env(safe-area-inset-top));
    }

    /* Header */
    .header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font: 700 1.05rem/1 "Space Grotesk", sans-serif;
      letter-spacing: -.02em;
    }
    .logo .mark {
      width: 28px; height: 28px;
      border: 1.5px solid var(--line-strong);
      border-radius: 7px;
      background: linear-gradient(135deg, var(--cyan), var(--magenta));
      display: grid;
      place-items: center;
    }
    .logo .mark:before {
      content: "";
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #06070a;
    }
    .meta { color: var(--muted); font: 500 .72rem/1 "Space Grotesk", sans-serif; }

    /* Score / stats */
    .stats {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat { text-align: center; }
    .stat .num { font: 700 1.4rem/1 "Space Grotesk", sans-serif; color: var(--text); }
    .stat .lbl { color: var(--muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; }
    .stat .num.cyan { color: var(--cyan); }
    .stat .num.amber { color: var(--amber); }
    .stat .num.green { color: var(--green); }

    /* Difficulty selector */
    .diff-bar {
      width: 100%;
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .diff-bar::-webkit-scrollbar { display: none; }
    .diff-btn {
      flex: 1;
      min-width: 80px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 9px 6px;
      cursor: pointer;
      font: 600 .7rem/1 "Space Grotesk", sans-serif;
      letter-spacing: .04em;
      color: var(--muted);
      transition: all .16s ease;
      white-space: nowrap;
    }
    .diff-btn:hover { border-color: var(--line-strong); background: var(--panel-2); color: var(--text); }
    .diff-btn.active {
      border-color: var(--cyan);
      background: rgba(57,208,255,0.09);
      color: var(--cyan);
      box-shadow: 0 0 16px rgba(57,208,255,0.22);
    }

    /* Main button */
    .cta {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(135deg, var(--cyan), var(--magenta));
      color: #06070a;
      font: 700 .8rem/1 "Space Grotesk", sans-serif;
      letter-spacing: .03em;
      padding: 15px 6px;
      cursor: pointer;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      transition: transform .06s ease, box-shadow .16s ease;
    }
    .cta:hover { box-shadow: 0 24px 50px rgba(57,208,255,0.36); }
    .cta:active { transform: scale(.98); }
    .cta.ghost {
      background: transparent;
      color: var(--text);
      border-color: var(--line-strong);
      box-shadow: none;
    }
    .cta.ghost:hover { box-shadow: 0 12px 30px rgba(0,0,0,0.3); }

    /* Game board */
    .board-wrap {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      position: relative;
    }
    .board {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .cell {
      border-radius: 6px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.06);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all .1s ease, background .2s ease;
    }
    .cell:hover { background: rgba(255,255,255,0.06); border-color: var(--line-strong); }
    .node {
      width: 72%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 2px solid var(--line-strong);
      background: linear-gradient(145deg, var(--cyan), var(--magenta));
      box-shadow:
        0 0 14px rgba(57,208,255,0.45),
        inset 0 0 10px rgba(255,255,255,0.3);
      cursor: pointer;
      transition: all .08s ease;
      position: relative;
      overflow: hidden;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .node::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.5), transparent 55%);
      opacity: .7;
    }
    .node:active {
      transform: scale(.9);
      box-shadow: 0 0 6px rgba(57,208,255,0.25);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 14px rgba(57,208,255,0.45), inset 0 0 10px rgba(255,255,255,0.3); }
      50% { box-shadow: 0 0 20px rgba(255,46,154,0.5), inset 0 0 12px rgba(255,255,255,0.35); }
      100% { box-shadow: 0 0 14px rgba(57,208,255,0.45), inset 0 0 10px rgba(255,255,255,0.3); }
    }

    /* Overlay / status */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(6,7,10,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 16px;
      text-align: center;
      z-index: 20;
    }
    .overlay h1 { font: 800 2rem/1.2 "Space Grotesk", sans-serif; letter-spacing: -.03em; }
    .overlay h1 .accent { color: var(--cyan); }
    .overlay p { color: var(--muted); font-size: .92rem; max-width: 320px; }

    /* Timer bar (top of board during play) */
    .timer-bar {
      height: 6px;
      width: 100%;
      max-width: 360px;
      border-radius: 4px;
      background: rgba(255,255,255,0.10);
      overflow: hidden;
      margin: 0 auto 12px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
    }
    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90, var(--green), var(--amber), var(--red));
      border-radius: 4px;
      transition: width .4s linear;
    }

    /* Result banner */
    .result {
      margin-top: 14px;
      font: 700 1rem/1 "Space Grotesk", sans-serif;
    }
    .result .score { color: var(--cyan); }
    .result .multiplier { color: var(--amber); }
    .result .streak { color: var(--green); }

    /* Footer */
    .footer {
      margin-top: 20px;
      color: var(--muted);
      font-size: .74rem;
      text-align: center;
      width: 100%;
    }

    /* Keyboard hint */
    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: .68rem;
      text-align: center;
      width: 100%;
    }

    @media (max-width: 420px) {
      .stat .num { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <span class="mark"></span>
        <span>NEXUS</span>
      </div>
      <div class="meta" id="phase">Calibration</div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="num cyan" id="score">0</div>
        <div class="lbl">Score</div>
      </div>
      <div class="stat">
        <div class="num amber" id="streak">0</div>
        <div class="lbl">Streak</div>
      </div>
      <div class="stat">
        <div class="num" id="highScore">0</div>
        <div class="lbl">Best</div>
      </div>
    </div>

    <!-- Difficulty -->
    <div class="diff-bar" id="diffBar">
      <button class="diff-btn active" data-diff="5">Easy</button>
      <button class="diff-btn" data-diff="3">Normal</button>
      <button class="diff-btn" data-diff="2">Hard</button>
    </div>

    <!-- Main CTA -->
    <button class="cta" id="startBtn">START GAME</button>

    <!-- Game board -->
    <div class="board-wrap" id="boardWrap">
      <div class="timer-bar" id="timerBar"><div class="timer-fill" id="timerFill"></div></div>
      <div class="board" id="board"></div>
    </div>

    <div class="result" id="result"></div>

    <div class="hint" id="hint"></div>

    <div class="footer">
      Tap the pulsing node before the timer runs out. Each hit extends your clock and grows your streak multiplier. Ciru research demo · ciru.ai/game
    </div>
  </div>

  <script>
    // ===== Configuration =====
    const GRID_SIZE = 4;              // 4x4 grid
    const DIFFICULTY_SETTINGS = {
      5: { time: 5000, name: "Easy" },   // ms per node
      3: { time: 3000, name: "Normal" },
      2: { time: 2000, name: "Hard" },
    };

    // ===== State =====
    let state = {
      playing: false,
      score: 0,
      streak: 0,
      best: 0,
      difficulty: 5,
      timeLeft: 0,
      timerId: null,
      lastNodeTime: 0,
      gameStartTime: 0,
    };

    // ===== DOM =====
    const board = document.getElementById("board");
    const startBtn = document.getElementById("startBtn");
    const scoreEl = document.getElementById("score");
    const streakEl = document.getElementById("streak");
    const highEl = document.getElementById("highScore");
    const phaseEl = document.getElementById("phase");
    const resultEl = document.getElementById("result");
    const timerBar = document.getElementById("timerBar");
    const timerFill = document.getElementById("timerFill");
    const diffBar = document.getElementById("diffBar");
    const hintEl = document.getElementById("hint");

    // ===== Utils =====
    const rand = (n) => Math.floor(Math.random() * n);
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    // ===== Load saved best score =====
    function loadBest() {
      const stored = localStorage.getItem("nexus-best");
      if (stored) state.best = parseInt(stored, 10);
      highEl.textContent = state.best;
    }
    function saveBest() {
      localStorage.setItem("nexus-best", String(state.best));
    }

    // ===== Render board cells =====
    function renderBoard() {
      board.innerHTML = "";
      const cells = GRID_SIZE * GRID_SIZE;
      for (let i = 0; i < cells; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.index = i;
        cell.addEventListener("click", onCellClick);
        cell.addEventListener("touchstart", onCellClick, { passive: false });
        board.appendChild(cell);
      }
    }

    // ===== Place a node =====
    function placeNode() {
      // Clear all cells
      board.querySelectorAll(".cell").forEach(c => {
        c.innerHTML = "";
        c.style.borderColor = "rgba(255,255,255,0.06)";
      });

      const emptyCells = Array.from(board.querySelectorAll(".cell"));
      const idx = rand(emptyCells.length);
      const cell = emptyCells[idx];
      cell.style.borderColor = "var(--cyan)";

      const node = document.createElement("div");
      node.className = "node";
      node.dataset.cellIndex = idx;
      cell.appendChild(node);

      state.lastNodeTime = Date.now();
    }

    // ===== Timer =====
    function startTimer(duration) {
      clearInterval(state.timerId);
      state.timeLeft = duration;
      state.lastNodeTime = Date.now();

      timerBar.style.display = "block";
      updateTimerBar();

      state.timerId = setInterval(() => {
        const elapsed = Date.now() - state.lastNodeTime;
        state.timeLeft = Math.max(0, duration - elapsed);

        if (state.timeLeft <= 0) {
          endGame();
          return;
        }
        updateTimerBar();
      }, 30);
    }

    function updateTimerBar() {
      const pct = (state.timeLeft / DIFFICULTY_SETTINGS[state.difficulty].time) * 100;
      timerFill.style.width = clamp(pct, 0, 100) + "%";
    }

    function stopTimer() {
      clearInterval(state.timerId);
      state.timerId = null;
      timerBar.style.display = "none";
    }

    // ===== Game flow =====
    function startGame() {
      const diff = DIFFICULTY_SETTINGS[state.difficulty];
      state.playing = true;
      state.score = 0;
      state.streak = 0;
      state.timeLeft = diff.time;
      state.gameStartTime = Date.now();

      startBtn.style.display = "none";
      diffBar.style.opacity = "0.5";
      diffBar.style.pointerEvents = "none";
      phaseEl.textContent = "Playing";
      resultEl.textContent = "";
      hintEl.textContent = "Tap the pulsing node!";

      placeNode();
      startTimer(diff.time);
    }

    function endGame() {
      state.playing = false;
      stopTimer();

      const finalScore = state.score;
      if (finalScore > state.best) {
        state.best = finalScore;
        saveBest();
        highEl.textContent = state.best;
      }

      phaseEl.textContent = "Game Over";
      diffBar.style.opacity = "1";
      diffBar.style.pointerEvents = "auto";
      startBtn.style.display = "block";
      startBtn.textContent = "PLAY AGAIN";

      resultEl.innerHTML = `<span class="score">${finalScore}</span> · streak <span class="streak">${state.streak}</span> · best <span class="score">${state.best}</span>`;
      hintEl.textContent = "New high score!" + (finalScore >= state.best && finalScore > 0 ? " 🎉" : "");
    }

    function nextRound() {
      const diff = DIFFICULTY_SETTINGS[state.difficulty];
      // Extend timer based on streak: harder difficulty = less bonus
      const streakBonus = Math.min(state.streak * 200, 1500);
      const baseExtension = diff.time * 0.5;
      const newDuration = Math.min(diff.time + baseExtension + streakBonus, diff.time * 3);

      placeNode();
      startTimer(newDuration);
    }

    // ===== Event handlers =====
    function onCellClick(e) {
      if (!state.playing) return;
      e.preventDefault();

      const cell = e.currentTarget;
      const node = cell.querySelector(".node");
      if (!node) return;

      // Hit!
      const diff = DIFFICULTY_SETTINGS[state.difficulty];
      state.streak += 1;
      const points = Math.round(100 * (1 + state.streak * 0.3));
      state.score += points;

      scoreEl.textContent = state.score;
      streakEl.textContent = state.streak;

      // Reset timer with extension
      const streakBonus = Math.min(state.streak * 200, 1500);
      const baseExtension = diff.time * 0.5;
      const newDuration = Math.min(diff.time + baseExtension + streakBonus, diff.time * 3);

      state.lastNodeTime = Date.now();
      state.timeLeft = newDuration;
      updateTimerBar();

      // Clear all nodes
      board.querySelectorAll(".cell").forEach(c => {
        c.innerHTML = "";
        c.style.borderColor = "rgba(255,255,255,0.06)";
      });

      // Brief flash, then place next node slightly faster
      setTimeout(() => {
        if (state.playing) placeNode();
      }, 120);
    }

    // Start button
    startBtn.addEventListener("click", () => {
      if (!state.playing) startGame();
    });

    // Difficulty buttons
    diffBar.addEventListener("click", (e) => {
      if (e.target.classList.contains("diff-btn") && !state.playing) {
        diffBar.querySelector(".diff-btn.active").classList.remove("active");
        e.target.classList.add("active");
        state.difficulty = parseInt(e.target.dataset.diff, 10);
        phaseEl.textContent = "Ready: " + DIFFICULTY_SETTINGS[state.difficulty].name;
        setTimeout(() => { if (!state.playing) phaseEl.textContent = "Calibration"; }, 1500);
      }
    });

    // Keyboard support (for desktop testing)
    document.addEventListener("keydown", (e) => {
      if (!state.playing) {
        if (e.key === " " || e.key === "Enter") {
          e.preventDefault();
          if (document.activeElement !== startBtn) startBtn.click();
        }
      }
    });

    // ===== Init =====
    renderBoard();
    loadBest();
    phaseEl.textContent = "Calibration";
    timerBar.style.display = "none";

    // Check for saved best and show hint
    if (state.best > 0) {
      hintEl.textContent = `Best score: ${state.best} · tap to beat it`;
    }
  </script>
</body>
</html>
